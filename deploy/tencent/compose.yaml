name: zhenwork
services:
  db:
    image: ${POSTGRES_IMAGE:?fixed amd64 image required}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    shm_size: 128m
    environment:
      POSTGRES_DB: workspace_rc2
      POSTGRES_USER: workspace_rc2
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=50, -c, work_mem=4MB]
    ports: ["127.0.0.1:18432:5432"]
    volumes: ["/srv/apps/zhenwork/shared/data/postgres:/var/lib/postgresql/data"]
    secrets: [pg-password]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workspace_rc2 -d workspace_rc2"]
      interval: 10s
      timeout: 3s
      retries: 6
  bridge-anchor:
    image: ${BRIDGE_IMAGE:?fixed amd64 base image required}
    entrypoint: [/usr/bin/sleep, infinity]
    user: "10001:10001"
    network_mode: bridge
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 8
    mem_limit: 8m
    cpus: 0.05
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 10s
      timeout: 2s
      retries: 3
  redis:
    image: ${REDIS_IMAGE:?fixed amd64 image required}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    ports: ["127.0.0.1:18379:6379"]
    volumes:
      - /srv/apps/zhenwork/shared/data/redis:/data
      - /srv/apps/zhenwork/shared/config/redis.conf:/etc/redis/zhenwork.conf:ro
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=$$(sed -n 's/^requirepass //p' /etc/redis/zhenwork.conf) redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
secrets:
  pg-password:
    file: /srv/apps/zhenwork/shared/config/pg-password
