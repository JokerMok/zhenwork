- id: system-prompt
  config:
    personaPrefix: 你是企业 AI 助手。按员工任务要求提供清晰、可核对的结果。
    personaSuffix: 不向用户描述内部运行架构；权限由服务端决定。
- id: llm-pi-ai
  config:
    providers:
      enterprise-gateway:
        api: openai-completions
        baseURL: http://model-gateway:8081/v1
        apiKeyEnv: WORKSPACE_MODEL_TOKEN
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: workspace-selected
            contextWindow: 2000000
            maxTokens: 32768
