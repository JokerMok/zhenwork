name: Product foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workspace_migrator
          POSTGRES_DB: workspace
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U workspace_migrator -d workspace"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      WORKSPACE_TEST_DATABASE_URL: postgresql://workspace_migrator:ci-ephemeral-only@127.0.0.1:5432/workspace
      WORKSPACE_CONFIG_FILE: .state/ci/config.json
      WORKSPACE_BOOTSTRAP_FILE: .state/ci/bootstrap.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/v1/init-ci.mjs
      - run: npm run migrate && node scripts/v1/grant-local-db.mjs && npm run bootstrap
      - run: npm run test:integration
      - run: node scripts/v1/check-http.mjs
      - run: node scripts/v1/check-http.mjs scripts/v1/test-identity.mjs
      - run: npm run build:services && npm run build:web
      - run: npm run scan:secrets && npm run scan:license && npm run scan:dependencies
      - run: mkdir -p evidence/ci && npm run sbom --silent > evidence/ci/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: evidence/ci
