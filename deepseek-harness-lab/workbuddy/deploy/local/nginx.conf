pid /tmp/nginx.pid;
events {worker_connections 1024;}
http {
 access_log off;
 error_log /dev/stderr warn;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 map $http_upgrade $connection_upgrade {default upgrade; '' close;}
 server {
  listen 8080;
  server_name _;
  client_max_body_size 21m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location /internal/ {return 404;}
  location /health/ {return 404;}
  location /api/ {proxy_pass http://host.docker.internal:3418;proxy_set_header Host $http_host;proxy_set_header X-Forwarded-For "";proxy_set_header X-Real-IP "";proxy_read_timeout 120s;}
  location = /ws {proxy_pass http://host.docker.internal:3418;proxy_http_version 1.1;proxy_set_header Host $http_host;proxy_set_header Upgrade $http_upgrade;proxy_set_header Connection $connection_upgrade;proxy_read_timeout 75s;}
  location / {proxy_pass http://host.docker.internal:3416;proxy_http_version 1.1;proxy_set_header Host $http_host;proxy_set_header Upgrade $http_upgrade;proxy_set_header Connection $connection_upgrade;}
 }
}
