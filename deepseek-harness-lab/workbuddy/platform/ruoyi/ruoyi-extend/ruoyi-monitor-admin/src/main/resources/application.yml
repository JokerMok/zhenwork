server:
  address: ${ZHENWORK_MONITOR_ADDRESS:127.0.0.1}
  port: ${ZHENWORK_MONITOR_PORT:9090}
spring:
  application:
    name: ruoyi-monitor-admin
  profiles:
    active: @profiles.active@

logging:
  config: classpath:logback-plus.xml

--- # 监控中心服务端配置
spring:
  security:
    user:
      name: @monitor.username@
      password: ${ZHENWORK_SPRING_SECURITY_USER_PASSWORD:}
  boot:
    admin:
      ui:
        title: ZhenWork 服务监控
      context-path: ${ZHENWORK_MONITOR_CONTEXT_PATH:/admin}
  # 忽略无用警告
  thymeleaf:
    check-template-location: false

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/ruoyi-monitor-admin.log

zhenwork:
  monitor:
    proxy-token: ${ZHENWORK_MONITOR_PROXY_TOKEN:}

--- # 监控配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: true
  # 设置 Spring Boot Admin Server 地址
  url: ${ZHENWORK_MONITOR_PUBLIC_URL:http://127.0.0.1:9090/admin}
  instance:
    service-host-type: IP
    metadata:
      user.name: ${spring.boot.admin.client.username}
      user.password: ${spring.boot.admin.client.password}
  username: @monitor.username@
  password: ${ZHENWORK_SPRING_BOOT_ADMIN_CLIENT_PASSWORD:}
